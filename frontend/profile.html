<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile | NovaStore</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="navbar">
      <a href="index.html" class="logo">Nova<span>Store</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="index.html#categories">Categories</a>
        <a href="index.html#about">About</a>
        <a class="active" href="profile.html">Profile</a>
        <a href="cart.html"
          >Cart <span id="cartCount" class="cart-count">0</span></a
        >
        <a
          class="profile-nav-link"
          href="profile.html"
          aria-label="My profile"
          title="My profile"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21a8 8 0 0 1 16 0"></path>
          </svg>
        </a>
      </nav>
      <button
        class="menu-toggle"
        id="menuToggle"
        aria-label="Toggle navigation"
      >
        ☰
      </button>
    </header>

    <main class="profile-page">
      <p class="eyebrow">YOUR ACCOUNT</p>
      <h1>My Profile</h1>
      <p id="profileMessage" class="form-message" role="status">
        Loading your profile…
      </p>

      <section class="profile-card" id="profileCard" hidden>
        <div class="profile-avatar" id="profileAvatar"></div>

        <div class="profile-fields">
          <div><span>Full name</span><strong id="profileName"></strong></div>
          <div>
            <span>Email address</span><strong id="profileEmail"></strong>
          </div>
          <div><span>Account type</span><strong id="profileRole"></strong></div>
          <div>
            <span>Member since</span><strong id="profileJoined"></strong>
          </div>
        </div>

        <div class="profile-actions">
          <button class="secondary-btn" id="logoutButton" type="button">
            Log out
          </button>
        </div>
      </section>

      <section class="password-card" aria-labelledby="changePasswordHeading">
        <h2 id="changePasswordHeading">Change password</h2>
        <p>Use your current password to set a new password.</p>
        <form id="changePasswordForm" class="password-form">
          <label>
            Current password
            <input name="currentPassword" type="password" autocomplete="current-password" required maxlength="128" />
          </label>
          <label>
            New password
            <input name="newPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128" />
          </label>
          <label>
            Confirm new password
            <input name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128" />
          </label>
          <button class="primary-btn" type="submit">Update password</button>
          <p id="passwordMessage" class="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="order-history-section" aria-labelledby="orderHistoryHeading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">YOUR PURCHASES</p>
            <h2 id="orderHistoryHeading">Order History</h2>
          </div>
          <a class="text-link" href="orders.html">View order history</a>
        </div>
        <div id="orderHistory" class="order-history-list">
          <p class="loading-state">Loading your orders…</p>
        </div>
      </section>
    </main>

    <script src="js/script.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
